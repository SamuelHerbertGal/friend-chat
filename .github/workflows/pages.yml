# Publishes public/ to GitHub Pages on every push to main.
#
# This is a STATIC PREVIEW only -- GitHub Pages cannot run server.mjs, so
# there is no backend here. The page loads and shows the sign-in screen
# (app.js already has a built-in error for exactly this case: "Can't reach
# the server"), but nothing that needs the database or Question Bot works.
# For a working deployment, see DEPLOY.md -- render.yaml runs the real
# Node server.
name: Deploy GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
